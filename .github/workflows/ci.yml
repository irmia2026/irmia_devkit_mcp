name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==8.4.2 build
      - name: Run tests
        run: python -m pytest -q
      - name: Build Python distributions
        run: python -m build
      - name: Audit npm package
        run: npm pack --dry-run
      - name: Smoke test npm launcher
        run: node bin/irmia-devkit.js --help
      - name: Smoke test POSIX launcher
        if: runner.os != 'Windows'
        run: bin/irmia-devkit.cmd --help
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\irmia-devkit.cmd --help
