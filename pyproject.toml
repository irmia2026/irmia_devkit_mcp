[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irmia-devkit-mcp"
version = "2.7.2"
description = "Irmia DevKit MCP Server — 为 Vibe Coding 工具提供安全代码开发工具集"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{name = "伊尔弥亚"}]
keywords = ["mcp", "coding-tools", "safe-edit", "reasonix-plugin"]
requires-python = ">=3.10"
dependencies = [
    "mcp==1.27.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "PyYAML==6.0.3",
    "psutil==7.2.2",
]

[project.scripts]
irmia-devkit = "server:main"

[project.urls]
Homepage = "https://github.com/irmia2026/irmia_devkit_mcp"
Repository = "https://github.com/irmia2026/irmia_devkit_mcp"
Issues = "https://github.com/irmia2026/irmia_devkit_mcp/issues"

[tool.setuptools]
py-modules = ["__main__", "server"]

[tool.setuptools.packages.find]
include = ["tools", "tools.*"]

[tool.ruff.lint]
ignore = ["E701", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_devkit_web.py --ignore=tests/test_group_default_config.py"
markers = ["slow: performance-sensitive tests"]
