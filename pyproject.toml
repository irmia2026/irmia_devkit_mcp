[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "irmia-devkit-mcp"
version = "2.7.1"
description = "Irmia DevKit MCP Server — 为 Vibe Coding 工具提供安全代码开发工具集"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
irmia-devkit = "__main__:main"

[tool.setuptools]
py-modules = ["__main__", "server"]

[tool.setuptools.package-data]
"*" = ["vendor/*", "bin/*", "pyproject.toml", "requirements.txt", "README.md", "LICENSE"]

[tool.ruff.lint]
ignore = ["E701", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_devkit_web.py --ignore=tests/test_group_default_config.py"
